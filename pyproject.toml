[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistant"
version = "0.0.1"
description = "Elaria — personal AI assistant daemon for Fedora + Hyprland (blueprint v29, Phase 0)"
readme = "README.md"
# Fedora 44 owner: CPython 3.14; keep code/tests 3.11-compatible too.
requires-python = ">=3.11"
# A fresh clone + plain `uv sync` is a WORKING runtime, not a stdlib-only
# fixture environment. Imports remain lazy so mock tests need no API key,
# model downloads or audio devices (blueprint §12.9).
dependencies = [
    "google-genai>=2.0.0",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "piper-tts",
]

[project.optional-dependencies]
# Compatibility names for existing `uv sync --extra ...` / pip commands.
# These capabilities now belong to the default runtime above.
live = []
offline = []
tts = []
# Real semantic embeddings (§10.5), beyond the default stdlib hashing seam.
embeddings = ["sentence-transformers"]
# Speaker diarization post-pass (§12.4); channel diarization needs no extra.
diarize = ["pyannote.audio"]
# Optional wake inference: ONE .onnx implementation (wake_guard.py), CPU.
# Do NOT restore openwakeword: its Linux dependency pulls cp311-only
# tflite-runtime even when given an ONNX model, breaking Fedora's cp314.
# ECAPA remains the external command seam; training stacks stay out of this env.
voice = ["onnxruntime>=1.24,<2"]
# Compatibility for `pip install -e '.[dev]'`; uv uses the default group below.
dev = ["pytest>=8", "ruff"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
assist = "assistant.cli:main"
assistd = "assistant.daemon:main"
assist-voice-test = "assistant.voicetest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# BLE001 (blind except) is permitted at deliberate resilience boundaries:
# doctor checks, the IPC handler and the cost ledger must degrade and
# report, never crash — each site converts the exception into data.
ignore = ["BLE001"]
