# Elaria Hyprland binds — legacy .conf syntax (pre-0.55).
# If `assist doctor` says "lua (hl.bind)", use elaria-binds.lua instead.
# Push-to-talk = press starts (bind), release stops (bindri).
#
# The release line uses `bindri` — release + ignore_mods. With `i` the
# stop fires on the key release no matter which modifiers are still held
# (Win-first or F2-first release order both stop cleanly; the legacy
# `bindr` forms fire only in their own order and leak the mic). Scene 3b
# (2026-10-26) proved both legacy orders failing on hardware; `bindri` is
# the WP3 form and the only order-robust one. Stops are idempotent — a
# double-fired stop is a clean no-op (schema line `stop.noop`).

bind  = SUPER, grave, exec, assist ptt start
bindri = SUPER, grave, exec, assist ptt stop --stop-source bind
bind  = SUPER SHIFT, F12, exec, assist halt
