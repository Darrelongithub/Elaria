# Elaria Hyprland binds — legacy .conf syntax (pre-0.55).
# If `assist doctor` says "lua (hl.bind)", use elaria-binds.lua instead.
# Push-to-talk = press starts (bind), release stops (bindr).

bind  = SUPER, grave, exec, assist ptt start
bindr = SUPER, grave, exec, assist ptt stop --stop-source bind
bind  = SUPER SHIFT, F12, exec, assist halt
